name: Bootstrap source import
on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-import.yml'
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand verified source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload-*.b64 | base64 -d > /tmp/jianwai-source.tar.xz
          mkdir -p /tmp/jianwai-source
          tar -xJf /tmp/jianwai-source.tar.xz -C /tmp/jianwai-source
          source_dir="$(find /tmp/jianwai-source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$source_dir"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$source_dir"/. .
      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Jianwai web v0.1 source"
          git push origin HEAD:main
